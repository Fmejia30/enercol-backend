services:
  postgres:
    image: postgres:17-alpine
    container_name: enercol-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: enercol
      POSTGRES_PASSWORD: enercol
      POSTGRES_DB: enercol
    volumes:
      - enercol_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enercol -d enercol']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  enercol_postgres:
